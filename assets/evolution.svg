<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="진화 단계 그래픽">
  <title>Evolution Line</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB44D"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
  </defs>

  <!-- 🥚 디지타마 -->
  <g transform="translate(66,72)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 0 30;7 0 30;-7 0 30" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0 -34 c19 0 30 20 30 34 c0 18 -14 28 -30 28 c-16 0 -30 -10 -30 -28 c0 -14 11 -34 30 -34 z"
            fill="#FFF6E2" stroke="#3B2A1E" stroke-width="4"/>
      <g fill="#FFB44D">
        <circle cx="-12" cy="2" r="6"/><circle cx="10" cy="-8" r="5"/><circle cx="6" cy="16" r="7"/>
      </g>
      <path d="M-14 -12 l8 8 l-6 8 l9 7" fill="none" stroke="#3B2A1E" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>

  <!-- beam 1 -->
  <g>
    <rect x="112" y="66" width="62" height="6" rx="3" fill="url(#beam)" opacity="0.35"/>
    <circle cy="69" r="5" fill="#FFB44D">
      <animate attributeName="cx" values="112;174" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 🐣 유년기 -->
  <g transform="translate(212,74)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="34" rx="26" ry="6" fill="#3B2A1E" opacity="0.12"/>
      <circle cx="0" cy="0" r="30" fill="#FFC978" stroke="#3B2A1E" stroke-width="4"/>
      <path d="M-22 -22 l-6 -16 l18 8 z" fill="#FFC978" stroke="#3B2A1E" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M22 -22 l6 -16 l-18 8 z" fill="#FFC978" stroke="#3B2A1E" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="10" rx="15" ry="11" fill="#FFF0D2"/>
      <g fill="#2B2B33">
        <ellipse cx="-10" cy="-3" rx="4" ry="5.5">
          <animate attributeName="ry" values="5.5;5.5;0.5;5.5;5.5" keyTimes="0;0.5;0.54;0.58;1" dur="3.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="10" cy="-3" rx="4" ry="5.5">
          <animate attributeName="ry" values="5.5;5.5;0.5;5.5;5.5" keyTimes="0;0.5;0.54;0.58;1" dur="3.4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <path d="M-5 8 q5 5 10 0" fill="none" stroke="#2B2B33" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- beam 2 -->
  <g>
    <rect x="256" y="66" width="62" height="6" rx="3" fill="url(#beam)" opacity="0.35"/>
    <circle cy="69" r="5" fill="#8FC7FF">
      <animate attributeName="cx" values="256;318" dur="1.4s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 🦖 성장기 -->
  <g transform="translate(372,68)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.4s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="44" rx="34" ry="7" fill="#3B2A1E" opacity="0.12"/>
      <path d="M28 18 q28 4 34 -22 q-2 28 -30 32 z" fill="#F79034" stroke="#3B2A1E" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="-14" cy="34" rx="13" ry="9" fill="#F79034" stroke="#3B2A1E" stroke-width="4"/>
      <ellipse cx="14" cy="34" rx="13" ry="9" fill="#F79034" stroke="#3B2A1E" stroke-width="4"/>
      <ellipse cx="0" cy="12" rx="32" ry="28" fill="#FFA94D" stroke="#3B2A1E" stroke-width="4"/>
      <ellipse cx="0" cy="18" rx="19" ry="17" fill="#FFE2B8"/>
      <circle cx="0" cy="-22" r="26" fill="#FFA94D" stroke="#3B2A1E" stroke-width="4"/>
      <path d="M-7 -45 l7 -16 l7 16 z" fill="#FFD98A" stroke="#3B2A1E" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-13" rx="16" ry="11" fill="#FFE2B8" stroke="#3B2A1E" stroke-width="3"/>
      <g fill="#2B2B33">
        <ellipse cx="-11" cy="-28" rx="4.5" ry="6">
          <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.4;0.44;0.48;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="11" cy="-28" rx="4.5" ry="6">
          <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.4;0.44;0.48;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <circle cx="-13" cy="-31" r="1.8" fill="#fff"/>
      <circle cx="9" cy="-31" r="1.8" fill="#fff"/>
    </g>
    <g fill="none" stroke="#FFD34D" stroke-width="3">
      <circle cx="0" cy="0" r="52" opacity="0.5">
        <animate attributeName="r" values="44;62" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="52" opacity="0.4" stroke="#4DA3FF">
        <animate attributeName="r" values="44;62" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ✨ -->
  <g fill="#FFD34D">
    <path d="M498 30 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M470 96 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
