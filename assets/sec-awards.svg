<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 62" width="900" height="62" role="img" aria-label="수상 경력">
<style>
@keyframes sweep { 0% { transform:translateX(-40%) } 100% { transform:translateX(190%) } }
@keyframes bob   { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
@keyframes tw    { 0%,100% { opacity:.55 } 50% { opacity:1 } }
@keyframes ping  { 0%,100% { transform:scale(1); opacity:1 } 55% { transform:scale(1.7); opacity:.45 } }
@keyframes halo  { 0% { transform:scale(.55); opacity:0 } 35% { opacity:.5 } 100% { transform:scale(1.9); opacity:0 } }
@keyframes wig   { 0%,72%,100% { transform:rotate(0) } 80% { transform:rotate(-9deg) } 90% { transform:rotate(9deg) } }
@keyframes spin  { from { transform:rotate(0) } to { transform:rotate(360deg) } }
@keyframes glow  { 0%,100% { opacity:.85 } 50% { opacity:1 } }
@keyframes lift  { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
@keyframes blink { 0%,100% { opacity:.35 } 50% { opacity:1 } }
.sweep { animation: sweep 4.6s ease-in-out infinite }
.bob   { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite }
.tw    { animation: tw 3s ease-in-out infinite }
.ping  { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-in-out infinite }
.halo  { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite }
.wig   { transform-box: fill-box; transform-origin: center; animation: wig 5s ease-in-out infinite }
.spin  { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite }
.glow  { animation: glow 2.8s ease-in-out infinite }
.lift  { transform-box: fill-box; transform-origin: center; animation: lift 4s ease-in-out infinite }
.blink { animation: blink 2.6s ease-in-out infinite }
</style><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
